name: lark_auth_server
server_id: 1
log: "./configs/logger.yaml"
grpc_server:
  name: lark_auth_server
  server_id: 1
  port: 6600
  max_connection_idle: 0
  max_connection_age: 0
  max_connection_age_grace: 0
  time: 7200000
  timeout: 20000
  connection_limit: 2000
  streams_limit: 2000
  max_recv_msg_size: 4096
  credential:
    cert_file: ./configs/tls/grpc/server.pem
    key_file: ./configs/tls/grpc/server.key
    enabled: true
  jaeger:
    host_port: "127.0.0.1:6831"
    sampler_type: "const"
    param: 1
    log_spans: true
    buffer_flush_interval: 1
    max_packet_size: 0
    enabled: false
etcd:
  endpoints: ["127.0.0.1:12379"]
  username:
  password:
  schema: lark
  read_timeout: 5000
  write_timeout: 5000
  dial_timeout: 5000
mysql:
  max_open_conns: 20
  max_idle_conns: 10
  max_lifetime: 120000
  max_idle_time: 7200000
  charset: utf8
  address: "127.0.0.1:13306"
  db: lark_user
  username: root
  password: lark2022
redis:
  address: ["127.0.0.1:63791"]
  db: 0
  password: lark2022
  prefix: "LK:"
chat_member_server:
  name: lark_chat_member_server
  cert:
    cert_file: ./configs/tls/grpc/server.pem
    enabled: true
    server_name_override: lark.com
jaeger:
  host_port: "127.0.0.1:6831"
  sampler_type: "const"
  param: 1
  log_spans: true
  buffer_flush_interval: 1
  max_packet_size: 0
  enabled: false
github_oauth2:
  client_id: ""
  client_secret: ""
  redirect_url: "http://localhost:8088/open/auth/github/callback"
  success_url: "http://localhost:8088/home?code=%s"
  failed_url: "http://localhost:8088/login"
google_oauth2:
  client_id: ""
  client_secret: ""
  redirect_url: "http://localhost:8088/open/auth/google/callback"
  scopes: ["https://www.googleapis.com/auth/userinfo.profile", "https://www.googleapis.com/auth/userinfo.email"]
  auth_url: "https://accounts.google.com/o/oauth2/auth"
  token_url: "https://accounts.google.com/o/oauth2/token"
  success_url: "http://localhost:8088/home?code=%s"
  failed_url: "http://localhost:8088/login"
